plugins {
    id "com.android.application"
}

// Scraveit Price Planner: a small offline calculator for restaurant owners.
// No Firebase, no sign-in and no internet permission; its maths is the same
// shared file the restaurant and customer apps use (shared/web).
android {
    namespace "com.feastly.planner"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.feastly.planner"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), rootProject.file("proguard-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    sourceSets {
        main.assets.srcDir rootProject.file("shared/web")
    }
}
