<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F6F9FD">
  <meta name="color-scheme" content="light dark">
  <!-- RTDB origin stays: tracking/{orderId} (live rider GPS during delivery)
       is still RTDB-authoritative until the rider app's presence-write path
       itself moves (a later phase) - only everything else here moved to
       Firestore. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://savrivo-app-sg.asia-southeast1.firebasedatabase.app https://firestore.googleapis.com https://firebasestorage.googleapis.com https://router.project-osrm.org; img-src 'self' data: https://tile.openstreetmap.org https://firebasestorage.googleapis.com https://savrivo-image-cdn.tirumurunbalu.workers.dev; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Scraveit</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app" class="app-shell" aria-live="polite" aria-busy="true">
    <main id="main-content" class="launch-placeholder">
      <div class="skeleton skeleton-logo"></div>
      <div class="skeleton skeleton-line wide"></div>
      <div class="skeleton skeleton-line"></div>
    </main>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="sheet-region"></div>
  <input id="media-picker" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp" aria-hidden="true">
  <script src="firebase-config.js"></script>
  <script src="firebase-app-compat.js"></script>
  <script src="firebase-auth-compat.js"></script>
  <script src="firebase-firestore-compat.js"></script>
  <script src="premium.js"></script>
</body>
</html>
