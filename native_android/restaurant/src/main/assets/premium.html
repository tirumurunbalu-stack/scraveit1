<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="color-scheme" content="dark light">
  <!-- RTDB origin dropped: the restaurant app's data (catalog, menus, orders,
       staff, applications) all moved to Firestore. It never used live GPS
       tracking/presence, so unlike the rider and customer apps it has no
       remaining reason to reach the RTDB origin at all. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebasestorage.googleapis.com; img-src 'self' data: https://tile.openstreetmap.org https://firebasestorage.googleapis.com; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Scraveit Restaurant</title>
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app" aria-live="polite" aria-busy="true"><main id="main-content" class="launch"><span class="spinner"></span><strong>Opening Scraveit</strong></main></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <div id="sheet-region"></div>
  <script src="firebase-config.js"></script>
  <script src="firebase-app-compat.js"></script>
  <script src="firebase-auth-compat.js"></script>
  <script src="firebase-firestore-compat.js"></script>
  <script src="store-config.js"></script>
  <script src="premium.js"></script>
</body>
</html>
