plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {
    namespace "com.feastly.rider"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.feastly.rider"
        minSdk 23
        targetSdk 36
        versionCode 69
        versionName "3.6.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
            // ML Kit's face-detector .so ships once per CPU architecture
            // (~9MB each); bundling all four is what pushed this debug build
            // past SendUserFile's size limit. Every phone this gets installed
            // on for testing is arm64, so debug only packages that one -
            // release is untouched and still ships every architecture.
            ndk { abiFilters "arm64-v8a" }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), rootProject.file("proguard-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    sourceSets {
        main.java.srcDir rootProject.file("shared/firebase/java")
    }

    packaging {
        resources.excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
    }
}

apply from: rootProject.file("gradle/nonprod-firebase.gradle")

dependencies {
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
    implementation "com.google.android.gms:play-services-auth:21.1.1"
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.camera:camera-core:1.4.1"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
    implementation "com.google.mlkit:face-detection:16.1.7"
    implementation platform("com.google.firebase:firebase-bom:34.18.0")
    implementation "com.google.firebase:firebase-messaging"
    releaseImplementation "com.google.firebase:firebase-appcheck-playintegrity"
    implementation "com.google.firebase:firebase-crashlytics"
    debugImplementation "com.google.firebase:firebase-appcheck-debug"
}
