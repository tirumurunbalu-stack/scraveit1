<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rider review &middot; Savrivo Admin</title>
<link rel="stylesheet" href="../assets/savrivo-admin.css?v=5">
</head>
<body>
<div class="shell" id="app-shell" hidden>
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">S</div>
      <div><strong>Savrivo</strong><span>Web Admin</span></div>
    </div>
    <div class="sidebar-section-label">Sections</div>
    <a class="sidebar-link" href="../analytics/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      Customer insights
    </a>
    <a class="sidebar-link active" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>
      Rider review
    </a>
    <a class="sidebar-link" href="../rider-rewards/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Rider Rewards
    </a>
    <a class="sidebar-link" href="../finance/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M7 15h3"/></svg>
      Finance
    </a>
    <div class="sidebar-link disabled">Orders (soon)</div>
    <div class="sidebar-link disabled">Restaurants (soon)</div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-account">
      <div class="who" id="sidebar-who"></div>
      <button class="sidebar-signout" id="signout-btn">Sign out</button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>Rider review</h1>
        <p>Delivery partner applications &mdash; the same checks and decisions as the Admin app.</p>
      </div>
      <div class="topbar-actions">
        <input class="input" id="search-input" placeholder="Search name, phone, city, PAN…" style="width:240px;">
        <button class="icon-btn" id="refresh-btn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <div id="load-error" class="notice notice-danger" hidden></div>
      <div id="loading-block" class="loading-block"><span class="spinner dark"></span> Loading applications…</div>

      <div id="dashboard" hidden>
        <section class="stat-grid" id="stat-grid" style="margin-bottom:20px;"></section>
        <div class="tabs" id="tabs"></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Rider</th><th>Phone</th><th>City</th><th>Applied</th><th>Identity</th><th style="text-align:right;">Actions</th></tr>
            </thead>
            <tbody id="rider-rows"></tbody>
          </table>
        </div>
        <div id="table-empty" class="empty-state" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>
          <p id="table-empty-text">No applications here.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-stack"></div>
<div id="drawer-root"></div>

<script type="module" src="./review.js?v=2"></script>
</body>
</html>
