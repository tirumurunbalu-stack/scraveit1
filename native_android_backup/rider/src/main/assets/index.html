olute;left:11px;top:13px;bottom:14px;border-left:2px dashed #3F7197}.review-row{position:relative;padding:0 0 22px 37px;color:#9CBBD2;font-size:11px}.review-row:before{content:"";position:absolute;left:3px;top:1px;width:14px;height:14px;border-radius:50%;background:#0B2440;border:3px solid #3C7098}.review-row.done:before{background:#45D99E;border-color:#45D99E}.review-row.current:before{background:#2E99F5;border-color:#2E99F5;box-shadow:0 0 0 6px #2993F522}.review-row b{display:block;color:#E9F7FF;font-size:12px;margin-bottom:4px}.rejected{border:1px solid #A94F5A;background:#501C2A;border-radius:15px;padding:13px;color:#FFD0D4;font-size:11px;line-height:1.45;text-align:left}.location-banner{border:1px solid #46B6FF55;background:linear-gradient(135deg,#0E3C6D,#0A294C);border-radius:16px;padding:13px;margin:0 0 15px;display:flex;gap:10px;align-items:center}.location-banner span{font-size:23px}.location-banner div{flex:1;font-size:10px;color:#B8DCF3;line-height:1.4}.location-banner b{display:block;color:#E9F7FF;font-size:12px;margin-bottom:3px}.location-banner button{border:0;border-radius:10px;background:#228CEE;color:white;padding:9px;font-size:9px;font-weight:900}.verified-pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:#48D7A31C;color:#8EEDC5;padding:6px 9px;font-size:9px;font-weight:900;margin-top:8px}.login-actions{margin-top:auto}.login-link{border:0;background:none;color:#83D6FF;font-size:11px;font-weight:900;padding:12px;width:100%}
</style></head><body><main id="root"></main><script src="firebase-config.js"></script><script>
const fb=window.FEASTLY_FIREBASE||{},DEVELOPMENT_RIDER_EMAILS=['tirumurubalu@gmail.com','23kb1a3351@nbkrist.org','personal08030803@gmail.com'];
let riderSession=readJson('feastlyRiderSession',null),riderScreen=riderSession?'jobs':'login',riderTab='jobs',riderOrders=[],riderLoading=false,riderTimer=null,activeJobId='';
function readJson(k,f){try{let v=JSON.parse(localStorage.getItem(k));return v===null?f:v}catch(e){return f}}
function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cash(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
async function req(url,opt){let r=await fetch(url,opt),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error((data.error&&data.error.message)||'Check your connection and try again.');return data}
function authUrl(path){return 'https://identitytoolkit.googleapis.com/v1/'+path+'?key='+encodeURIComponent(fb.apiKey||'')}
function saveSession(d,email){riderSession={uid:d.localId||d.user_id,idToken:d.idToken||d.id_token,refreshToken:d.refreshToken||d.refresh_token,email:email,expiresAt:Date.now()+Math.max(1,Number(d.expiresIn||d.expires_in||3600)-60)*1000};localStorage.setItem('feastlyRiderSession',JSON.stringify(riderSession))}
async function valid(){if(!riderSession)throw new Error('Sign in again to continue.');if(Date.now()<riderSession.expiresAt)return riderSession;let body=new URLSearchParams({grant_type:'refresh_token',refresh_token:riderSession.refreshToken}),d=await req('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(fb.apiKey||''),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()});saveSession(d,riderSession.email);return riderSession}
async function db(method,path,data){let s=await valid(),url=(fb.databaseUrl||'').replace(/\/$/,'')+'/'+path+'.json?auth='+encodeURIComponent(s.idToken);return req(url,{method:method,headers:data===undefined?undefined:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)})}
function setNotice(t,kind){let n=document.getElementById('notice');if(n){n.textContent=t||'';n.className='notice '+(t?(kind||'error'):'')}}
async function signIn(){let email=(document.getElementById('email').value||'').trim().toLowerCase(),password=document.getElementById('password').value||'';setNotice('');if(!email||!password){setNotice('Enter your rider email and password.');return}if(!DEVELOPMENT_RIDER_EMAILS.includes(email)){setNotice('This rider account is not yet approved. An administrator must add the delivery partner.');return}let b=document.getElementById('signIn');b.disabled=true;b.textContent='Signing in…';try{let d=await req(authUrl('accounts:signInWithPassword'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password,returnSecureToken:true})});saveSession(d,email);riderScreen='jobs';riderTab='jobs';render();refreshJobs(true)}catch(e){setNotice((e.message||'Sign-in failed.').replace(/_/g,' '))}finally{if(b){b.disabled=false;b.textContent='Sign in securely'}}}
function flatten(tree){let out=[];Object.keys(tree||{}).forEach(uid=>Object.keys(tree[uid]||{}).forEach(id=>out.push(Object.assign({id:id,userId:uid},tree[uid][id]||{}))));return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
async function refreshJobs(showError){if(riderLoading)return;riderLoading=true;render();try{riderOrders=flatten(await db('GET','feastly/orders'));if(!riderTimer)riderTimer=setInterval(()=>refreshJobs(false),30000)}catch(e){if(showError)alert('Delivery data needs the secure Firebase rider rule before orders can be loaded.')}finally{riderLoading=false;render()}}
function assignable(){return riderOrders.filter(o=>['Accepted','Preparing'].includes(o.status||'Order placed')&&!o.riderId)}
function mine(){return riderOrders.filter(o=>o.riderId===riderSession.uid&&o.status!=='Delivered'&&o.status!=='Cancelled')}
function statusName(v){return v==='Out for delivery'?'On the way':v||'Order placed'}
function jobCard(o,owned){let address=o.address||{},items=(o.items||[]).map(x=>(x.qty||1)+' × '+x.name).join(', ')||'Order items';return `<article class="card"><div class="job-head"><div class="job-icon">${owned?'🛵':'🍽️'}</div><div class="job-title"><b>${esc(o.restaurant||'Restaurant')}</b><small>Order #${esc(o.id)} · ${cash(o.total)}</small></div><div class="amount">${owned?'LIVE':'NEW'}</div></div><span class="tag ${owned?'':'wait'}">${esc(statusName(o.status))}</span><div class="line"><span>◉</span><div><b>Pick up</b><br>${esc(o.restaurant||'Restaurant')}</div></div><div class="line"><span>⌖</span><div><b>Deliver to</b><br>${esc(address.label||'Customer address')} · ${esc(address.details||'Address unavailable')}</div></div><div class="line"><span>▣</span><div>${esc(items)}</div></div>${owned?`<button class="primary" onclick="openJob('${esc(o.id)}')">Manage delivery</button>`:`<button class="primary" onclick="claimJob('${esc(o.userId)}','${esc(o.id)}')">Accept delivery</button>`}</article>`}
function jobsPage(){let open=assignable(),current=mine();return `<section class="shell"><header class="top"><div class="mark">F</div><div class="copy"><div class="eyebrow">FEASTLY RIDER</div><h1>Ready to deliver.</h1></div><button class="icon" onclick="refreshJobs(true)">↻</button></header><div class="hero"><small>${riderLoading?'SYNCING ORDERS':'ONLINE · DELIVERY PARTNER'}</small><h2>${current.length?current.length+' active delivery'+(current.length>1?'ies':''):'You are ready for orders.'}</h2><p>Accept a job, pick it up, and keep the customer informed with live progress.</p></div><div class="metrics"><div class="metric"><small>ACTIVE</small><b>${current.length}</b><span>In your queue</span></div><div class="metric"><small>AVAILABLE</small><b>${open.length}</b><span>Ready to accept</span></div></div>${current.length?`<div class="section"><h2>My deliveries</h2><button class="link" onclick="riderTab='active';render()">See all</button></div>${current.slice(0,2).map(o=>jobCard(o,true)).join('')}`:''}<div class="section"><h2>Available deliveries</h2><button class="link" onclick="refreshJobs(true)">Refresh</button></div>${open.length?open.map(o=>jobCard(o,false)).join(''):'<div class="empty">No delivery is waiting right now.<br>Accepted customer orders will appear here.</div>'}</section>`}
function activePage(){let current=mine();return `<section class="shell"><header class="top"><div class="mark">🛵</div><div class="copy"><div class="eyebrow">MY ROUTE</div><h1>Active deliveries</h1></div><button class="icon" onclick="refreshJobs(true)">↻</button></header>${current.length?current.map(o=>jobCard(o,true)).join(''):'<div class="empty">No active deliveries.<br>Accept an available order from the Jobs tab.</div>'}</section>`}
function accountPage(){return `<section class="shell"><header class="top"><div class="mark">◉</div><div class="copy"><div class="eyebrow">RIDER ACCOUNT</div><h1>${esc((riderSession.email||'Rider').split('@')[0])}</h1></div></header><article class="card"><div class="line"><span>●</span><div><b style="color:#89ECC0">Available for delivery</b><br>Live rider status is connected to Feastly operations.</div></div><div class="line"><span>⌁</span><div><b>Order synchronization</b><br>Every 30 seconds while the app is open.</div></div></article><button class="secondary" onclick="signOut()">Sign out</button></section>`}
function detailPage(){let o=riderOrders.find(x=>x.id===activeJobId);if(!o){riderScreen='active';return activePage()}let address=o.address||{},next=o.status==='Out for delivery'?'Delivered':'Out for delivery';return `<section class="shell"><header class="top"><button class="icon" onclick="riderScreen='active';render()">‹</button><div class="copy"><div class="eyebrow">DELIVERY DETAILS</div><h1>${esc(o.restaurant||'Order')}</h1></div></header>${jobCard(o,true)}<article class="card"><div class="line"><span>☎</span><div><b>Customer mobile</b><br>${esc(address.phone||'Not provided')}</div></div><div class="line"><span>₹</span><div><b>Payment</b><br>${esc(o.paymentMethod||'COD')}</div></div></article><button class="primary" onclick="updateJob('${esc(o.userId)}','${esc(o.id)}','${next}')">Mark ${next}</button></section>`}
async function claimJob(uid,id){let order=riderOrders.find(o=>o.userId===uid&&o.id===id);if(!order)return;try{await db('PATCH','feastly/orders/'+uid+'/'+id,{riderId:riderSession.uid,riderName:(riderSession.email||'Rider').split('@')[0],status:'Out for delivery',updatedAt:Date.now()});order.riderId=riderSession.uid;order.status='Out for delivery';riderTab='active';riderScreen='active';render()}catch(e){alert('This delivery could not be accepted. Approve the secure rider rule, then try again.')}}
async function updateJob(uid,id,status){try{await db('PATCH','feastly/orders/'+uid+'/'+id,{status:status,updatedAt:Date.now()});let o=riderOrders.find(x=>x.userId===uid&&x.id===id);if(o)o.status=status;riderScreen='active';render()}catch(e){alert('The delivery status could not be saved. Please try again.')}}
function openJob(id){activeJobId=id;riderScreen='detail';render()}
function signOut(){if(riderTimer)clearInterval(riderTimer);riderTimer=null;localStorage.removeItem('feastlyRiderSession');riderSession=null;riderOrders=[];riderScreen='login';render()}
function nav(){if(riderScreen==='login'||riderScreen==='detail')return '';return `<footer class="bottom"><div class="nav">${[['jobs','⌂','Jobs'],['active','🛵','Active'],['account','◉','Account']].map(x=>`<button class="${riderTab===x[0]?'active':''}" onclick="riderTab='${x[0]}';riderScreen='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></footer>`}
function login(){return `<section class="login"><div class="login-mark">F</div><h1>Feastly Rider</h1><p>Delivery operations for assigned Feastly partners.</p><label class="label">Approved rider email</label><input id="email" class="field" type="email" placeholder="rider@company.com" autocomplete="email"><label class="label">Password</label><input id="password" class="field" type="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()"><div id="notice" class="notice"></div><button id="signIn" class="primary" onclick="signIn()">Sign in securely</button><p class="foot">Only delivery partners approved by Feastly can access live customer delivery information.</p></section>`}
function render(){let view={login:login,jobs:jobsPage,active:activePage,account:accountPage,detail:detailPage}[riderScreen]||login;document.getElementById('root').innerHTML=view()+nav()}
window.FeastlyRiderBack=function(){if(riderScreen==='detail'){riderScreen='active';render();return 'handled'}if(!['jobs','login'].includes(riderScreen)){riderScreen='jobs';riderTab='jobs';render();return 'handled'}return 'root'};
render();
</script><script>
let riderProfile={},partnerDocumentDraft={},pendingLocationClaim=null,locationBlocked=false,partnerBootstrapBusy=false;
function profileName(){return riderProfile.fullName||(riderSession&&riderSession.email||'Delivery partner').split('@')[0]}
function documentState(key){return partnerDocumentDraft[key]?'READY':'REQUIRED'}
function friendlyPartnerError(error){let m=(error&&error.message)||'Something went wrong. Please try again.';if(m.includes('EMAIL_EXISTS'))return 'An account already exists with this email. Sign in instead.';if(m.includes('INVALID_LOGIN_CREDENTIALS'))return 'Email or password is incorrect.';if(m.includes('WEAK_PASSWORD'))return 'Use a password with at least 6 characters.';if(m.includes('PERMISSION_DENIED'))return 'Secure partner access is not active yet. Please contact Feastly support.';return m.replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase())}
async function signIn(){let email=(document.getElementById('email').value||'').trim().toLowerCase(),password=document.getElementById('password').value||'';setNotice('');if(!email||!password){setNotice('Enter your email and password.');return}let b=document.getElementById('signIn');b.disabled=true;b.textContent='Signing in securely…';try{let d=await req(authUrl('accounts:signInWithPassword'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password,returnSecureToken:true})});saveSession(d,email);await bootstrapPartner()}catch(e){setNotice(friendlyPartnerError(e))}finally{if(b){b.disabled=false;b.textContent='Sign in securely'}}}
async function createPartnerAccount(){let name=field('registerName'),email=field('registerEmail').toLowerCase(),phone=field('registerPhone'),password=field('registerPassword'),confirmPassword=field('registerConfirm');let notice=document.getElementById('registerNotice');if(notice){notice.textContent='';notice.className='notice'}if(!name||!/^\S+@\S+\.\S+$/.test(email)||phone.replace(/\D/g,'').length<10){partnerNotice('Enter your full name, valid email and mobile number.');return}if(password.length<6){partnerNotice('Use a password with at least 6 characters.');return}if(password!==confirmPassword){partnerNotice('Passwords do not match.');return}let button=document.getElementById('registerSubmit');button.disabled=true;button.textContent='Creating secure account…';try{let d=await req(authUrl('accounts:signUp'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password,returnSecureToken:true})});saveSession(d,email);riderProfile={fullName:name,email:email,phone:phone,status:'draft'};await req(authUrl('accounts:sendOobCode'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestType:'VERIFY_EMAIL',idToken:riderSession.idToken})}).catch(()=>null);riderScreen='onboarding';render()}catch(e){partnerNotice(friendlyPartnerError(e))}finally{button.disabled=false;button.textContent='Create partner account'}}
function field(id){let node=document.getElementById(id);return node?(node.value||'').trim():''}
function partnerNotice(message,type){let box=document.getElementById('registerNotice')||document.getElementById('onboardingNotice');if(box){box.textContent=message||'';box.className='notice '+(message?(type||'error'):'')}}
async function bootstrapPartner(){if(partnerBootstrapBusy||!riderSession)return;partnerBootstrapBusy=true;try{riderProfile=await db('GET','feastly/riders/'+riderSession.uid)||{email:riderSession.email,status:'draft'};if(riderProfile.status==='approved'){riderScreen='jobs';riderTab='jobs';render();await refreshJobs(true)}else if(riderProfile.status==='submitted'||riderProfile.status==='under_review'||riderProfile.status==='rejected'){riderScreen='pending';render()}else{riderScreen='onboarding';render()}}catch(e){riderScreen='onboarding';riderProfile={email:riderSession.email,status:'draft'};render()}finally{partnerBootstrapBusy=false}}
function registerPage(){return `<section class="login"><div class="top"><button class="icon" onclick="riderScreen='login';render()">‹</button><div class="copy"><div class="eyebrow">PARTNER REGISTRATION</div><h1>Create your account</h1></div></div><div class="stepper-top"><i class="step-dot done"></i><i class="step-dot"></i><i class="step-dot"></i></div><h2 class="form-title">Start delivering with Feastly.</h2><p class="form-lead">Create a private account. You will submit your delivery and verification details next.</p><label class="label">Full legal name</label><input id="registerName" class="field" autocomplete="name" placeholder="As shown on your documents"><label class="label">Email address</label><input id="registerEmail" class="field" type="email" autocomplete="email" placeholder="you@example.com"><label class="label">Mobile number</label><input id="registerPhone" class="field" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210"><label class="label">Password</label><input id="registerPassword" class="field" type="password" autocomplete="new-password" placeholder="Minimum 6 characters"><label class="label">Confirm password</label><input id="registerConfirm" class="field" type="password" autocomplete="new-password" placeholder="Enter password again"><div id="registerNotice" class="notice"></div><button id="registerSubmit" class="primary" onclick="createPartnerAccount()">Create partner account</button><p class="foot">Your account remains unable to view or accept orders until Feastly approves your application.</p></section>`}
function onboardingPage(){let p=riderProfile||{};return `<section class="shell"><header class="top"><div class="mark">F</div><div class="copy"><div class="eyebrow">SECURE ONBOARDING</div><h1>Partner application</h1></div><button class="icon" onclick="signOut()">↪</button></header><div class="stepper-top"><i class="step-dot done"></i><i class="step-dot done"></i><i class="step-dot"></i></div><h2 class="form-title">Tell us about your delivery profile.</h2><p class="form-lead">Complete every field. Only approved Feastly administrators can review this information.</p><label class="label">Full legal name</label><input id="partnerName" class="field" autocomplete="name" value="${esc(p.fullName||'')}" placeholder="Full name"><div class="row"><div><label class="label">Mobile</label><input id="partnerPhone" class="field" type="tel" inputmode="tel" value="${esc(p.phone||'')}" placeholder="Mobile number"></div><div><label class="label">City</label><input id="partnerCity" class="field" value="${esc(p.city||'Nellore')}" placeholder="City"></div></div><label class="label">Residential address</label><input id="partnerAddress" class="field" value="${esc(p.address||'')}" placeholder="House, street, area"><div class="row"><div><label class="label">Vehicle type</label><select id="vehicleType" class="field select"><option>Bike</option><option>Scooter</option><option>Cycle</option><option>Electric bike</option></select></div><div><label class="label">Vehicle number</label><input id="vehicleNumber" class="field" value="${esc(p.vehicleNumber||'')}" placeholder="AP 00 AA 0000"></div></div><div class="row"><div><label class="label">Aadhaar last 4 digits</label><input id="aadhaarLast4" class="field" inputmode="numeric" maxlength="4" value="${esc(p.aadhaarLast4||'')}" placeholder="1234"></div><div><label class="label">PAN number</label><input id="panNumber" class="field" maxlength="10" value="${esc(p.panNumber||'')}" placeholder="ABCDE1234F" style="text-transform:uppercase"></div></div><div class="privacy-note"><b>Use a masked Aadhaar copy.</b><br>Hide the first 8 digits before uploading. Feastly records only the final 4 digits in your profile.</div>${documentUploadCard('aadhaarFront','Aadhaar — front','Masked copy; first 8 digits hidden','▣')}${documentUploadCard('aadhaarBack','Aadhaar — back','Address side of the masked copy','▤')}${documentUploadCard('panCopy','PAN card copy','Clear image for partner verification','▥')}<label class="consent"><input id="partnerConsent" type="checkbox"><span>I confirm these documents belong to me, my Aadhaar copy is masked, and I consent to Feastly using them only for delivery-partner verification. Copies are removed after approval.</span></label><div id="onboardingNotice" class="notice"></div><button id="applicationSubmit" class="primary" onclick="submitPartnerApplication()">Submit for secure review</button><button class="secondary" onclick="signOut()">Save and exit</button></section>`}
function documentUploadCard(key,title,help,icon){return `<div class="doc-box"><div class="doc-head"><div class="doc-icon">${icon}</div><div class="doc-copy"><b>${title}</b><small>${help}</small></div><span class="doc-state" id="${key}State">${documentState(key)}</span></div><label class="file-button">Choose and compress image<input type="file" accept="image/jpeg,image/png,image/webp" onchange="preparePartnerDocument(event,'${key}')"></label></div>`}
async function preparePartnerDocument(event,key){let file=event.target.files&&event.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){partnerNotice('Choose a JPG, PNG or WebP image.');return}if(file.size>8*1024*1024){partnerNotice('Choose an image smaller than 8 MB.');return}let state=document.getElementById(key+'State');if(state)state.textContent='COMPRESSING…';try{let data=await compressPartnerDocument(file);partnerDocumentDraft[key]={data:data,contentType:'image/jpeg',originalName:file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),size:Math.round(data.length*.75),uploadedAt:Date.now()};if(state){state.textContent='READY';state.style.color='#8EEDC5'}}catch(e){if(state)state.textContent='REQUIRED';partnerNotice((e&&e.message)||'This image could not be prepared.') }}
function compressPartnerDocument(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(new Error('The file could not be read.'));reader.onload=()=>{let image=new Image();image.onerror=()=>reject(new Error('Choose a clear image file.'));image.onload=()=>{let max=1350,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));let context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);let output=canvas.toDataURL('image/jpeg',.64);if(output.length>360000)output=canvas.toDataURL('image/jpeg',.48);if(output.length>470000)return reject(new Error('The compressed image is still too large. Crop it closer and try again.'));resolve(output)};image.src=reader.result};reader.readAsDataURL(file)})}
async function submitPartnerApplication(){let name=field('partnerName'),phone=field('partnerPhone'),city=field('partnerCity'),address=field('partnerAddress'),vehicleType=field('vehicleType'),vehicleNumber=field('vehicleNumber').toUpperCase(),aadhaarLast4=field('aadhaarLast4'),pan=field('panNumber').toUpperCase(),consent=document.getElementById('partnerConsent').checked;if(!name||phone.replace(/\D/g,'').length<10||!city||!address||!vehicleNumber){partnerNotice('Complete your name, mobile, address, city and vehicle number.');return}if(!/^\d{4}$/.test(aadhaarLast4)){partnerNotice('Enter only the last 4 digits of Aadhaar.');return}if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)){partnerNotice('Enter a valid 10-character PAN number.');return}if(!partnerDocumentDraft.aadhaarFront||!partnerDocumentDraft.aadhaarBack||!partnerDocumentDraft.panCopy){partnerNotice('Add all three masked identity-document images.');return}if(!consent){partnerNotice('Read and accept the verification consent to continue.');return}let button=document.getElementById('applicationSubmit');button.disabled=true;button.textContent='Submitting securely…';let now=Date.now(),profile={fullName:name,email:riderSession.email,phone:phone,city:city,address:address,vehicleType:vehicleType,vehicleNumber:vehicleNumber,aadhaarLast4:aadhaarLast4,panNumber:pan,status:'submitted',consentVersion:'partner-verification-v1',consentAt:now,submittedAt:now,updatedAt:now};try{await db('PUT','feastly/riderDocuments/'+riderSession.uid,partnerDocumentDraft);await db('PUT','feastly/riders/'+riderSession.uid,profile);riderProfile=profile;partnerDocumentDraft={};riderScreen='pending';render()}catch(e){partnerNotice(friendlyPartnerError(e))}finally{button.disabled=false;button.textContent='Submit for secure review'}}
function pendingPage(){let rejected=riderProfile.status==='rejected';return `<section class="shell pending-shell"><div class="pending-mark">${rejected?'!':'✓'}</div><div class="eyebrow">${rejected?'APPLICATION NEEDS ATTENTION':'APPLICATION RECEIVED'}</div><h1>${rejected?'Update your application':'We are reviewing your details.'}</h1><p>${rejected?'An administrator requested a correction. Update the information and submit again.':'Your account is secure, but order access remains locked until approval.'}</p>${rejected?`<div class="rejected"><b>Review note</b><br>${esc(riderProfile.rejectionReason||'Please review your submitted information and documents.')}</div>`:''}<div class="review-track"><div class="review-row done"><b>Account created</b>Email and password secured by Firebase Authentication</div><div class="review-row done"><b>Application submitted</b>Profile and masked documents received</div><div class="review-row ${rejected?'':'current'}"><b>Administrator verification</b>${rejected?'Correction requested':'Waiting for Feastly approval'}</div><div class="review-row"><b>Partner access</b>Orders unlock only after approval</div></div><button class="primary" onclick="bootstrapPartner()">Check approval status</button>${rejected?'<button class="secondary" onclick="partnerDocumentDraft={};riderScreen=\'onboarding\';render()">Edit and resubmit</button>':''}<button class="login-link" onclick="signOut()">Sign out</button></section>`}
async function refreshJobs(showError){if(riderLoading||!riderSession)return;if(riderProfile.status!=='approved'){await bootstrapPartner();return}riderLoading=true;render();try{riderOrders=flatten(await db('GET','feastly/orders'));let current=mine().find(o=>o.status==='Out for delivery');if(current)startNativeTracking(current);if(!riderTimer)riderTimer=setInterval(()=>refreshJobs(false),20000)}catch(e){if(showError)alert('Live orders could not be loaded. Check your connection and approval status.')}finally{riderLoading=false;render()}}
function jobsPage(){let open=assignable(),current=mine();return `<section class="shell"><header class="top"><div class="mark">F</div><div class="copy"><div class="eyebrow">FEASTLY RIDER</div><h1>Good ${new Date().getHours()<12?'morning':'day'}, ${esc(profileName().split(' ')[0])}.</h1><span class="verified-pill">✓ APPROVED PARTNER</span></div><button class="icon" onclick="refreshJobs(true)">↻</button></header>${locationBlocked?`<div class="location-banner"><span>⌖</span><div><b>Location is required</b>Turn on Location before accepting a delivery.</div><button onclick="openRiderLocationSettings()">OPEN SETTINGS</button></div>`:''}<div class="hero"><small>${riderLoading?'SYNCING ORDERS':'ONLINE · DELIVERY PARTNER'}</small><h2>${current.length?current.length+' active delivery'+(current.length>1?'ies':''):'You are ready for orders.'}</h2><p>Live location is shared only from acceptance until delivery completion.</p></div><div class="metrics"><div class="metric"><small>ACTIVE</small><b>${current.length}</b><span>In your queue</span></div><div class="metric"><small>AVAILABLE</small><b>${open.length}</b><span>Ready to accept</span></div></div>${current.length?`<div class="section"><h2>My deliveries</h2><button class="link" onclick="riderTab='active';riderScreen='active';render()">See all</button></div>${current.slice(0,2).map(o=>jobCard(o,true)).join('')}`:''}<div class="section"><h2>Available deliveries</h2><button class="link" onclick="refreshJobs(true)">Refresh</button></div>${open.length?open.map(o=>jobCard(o,false)).join(''):'<div class="empty">No delivery is waiting right now.<br>Accepted customer orders will appear here.</div>'}</section>`}
function accountPage(){return `<section class="shell"><header class="top"><div class="mark">◉</div><div class="copy"><div class="eyebrow">APPROVED PARTNER</div><h1>${esc(profileName())}</h1></div></header><article class="card"><div class="line"><span>●</span><div><b style="color:#89ECC0">Approved and available</b><br>Live operational access is active.</div></div><div class="line"><span>☎</span><div><b>${esc(riderProfile.phone||'Mobile not recorded')}</b><br>${esc(riderProfile.vehicleType||'Vehicle')} · ${esc(riderProfile.vehicleNumber||'Number not recorded')}</div></div><div class="line"><span>⌁</span><div><b>Privacy protected</b><br>Identity copies are removed after approval; verification status is retained.</div></div></article><button class="secondary" onclick="signOut()">Sign out</button></section>`}
async function claimJob(uid,id){let order=riderOrders.find(o=>o.userId===uid&&o.id===id);if(!order||riderProfile.status!=='approved')return;pendingLocationClaim={uid:uid,id:id};if(window.FeastlyRiderNative&&window.FeastlyRiderNative.requestLocationAccess){window.FeastlyRiderNative.requestLocationAccess()}else await finishClaimJob(uid,id)}
async function finishClaimJob(uid,id){let order=riderOrders.find(o=>o.userId===uid&&o.id===id);if(!order)return;let path='feastly/orders/'+uid+'/'+id;try{await db('PUT',path+'/riderId',riderSession.uid);await Promise.all([db('PUT',path+'/riderName',profileName()),db('PUT',path+'/status','Out for delivery'),db('PUT',path+'/updatedAt',Date.now())]);order.riderId=riderSession.uid;order.riderName=profileName();order.status='Out for delivery';pendingLocationClaim=null;locationBlocked=false;await startNativeTracking(order);riderTab='active';riderScreen='active';render()}catch(e){alert('This delivery could not be accepted. It may already be assigned to another partner.');refreshJobs(false)}}
function riderLocationPermissionResult(granted,enabled){if(granted&&enabled&&pendingLocationClaim){finishClaimJob(pendingLocationClaim.uid,pendingLocationClaim.id);return}locationBlocked=true;pendingLocationClaim=null;render()}
function openRiderLocationSettings(){if(window.FeastlyRiderNative&&window.FeastlyRiderNative.openLocationSettings)window.FeastlyRiderNative.openLocationSettings()}
async function startNativeTracking(order){if(!order||!riderSession||!window.FeastlyRiderNative||!window.FeastlyRiderNative.startDeliveryTracking)return;let active=await valid();window.FeastlyRiderNative.startDeliveryTracking(order.userId,order.id,riderSession.uid,profileName(),active.idToken)}
async function updateJob(uid,id,status){let path='feastly/orders/'+uid+'/'+id;try{await db('PUT',path+'/status',status);await db('PUT',path+'/updatedAt',Date.now());let o=riderOrders.find(x=>x.userId===uid&&x.id===id);if(o)o.status=status;if(status==='Delivered'&&window.FeastlyRiderNative&&window.FeastlyRiderNative.stopDeliveryTracking)window.FeastlyRiderNative.stopDeliveryTracking();riderScreen='active';render()}catch(e){alert('The delivery status could not be saved. Please try again.')}}
function signOut(){if(riderTimer)clearInterval(riderTimer);riderTimer=null;if(window.FeastlyRiderNative&&window.FeastlyRiderNative.stopDeliveryTracking)window.FeastlyRiderNative.stopDeliveryTracking();localStorage.removeItem('feastlyRiderSession');riderSession=null;riderProfile={};riderOrders=[];partnerDocumentDraft={};riderScreen='login';riderTab='jobs';render()}
function login(){return `<section class="login"><div class="login-mark">F</div><h1>Feastly Rider</h1><p>Secure delivery operations for verified Feastly partners.</p><label class="label">Email address</label><input id="email" class="field" type="email" placeholder="you@example.com" autocomplete="email"><label class="label">Password</label><input id="password" class="field" type="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()"><div id="notice" class="notice"></div><div class="login-actions"><button id="signIn" class="primary" onclick="signIn()">Sign in securely</button><button class="login-link" onclick="riderScreen='register';render()">New delivery partner? Create account</button></div><p class="foot">Registration does not provide order access. Every delivery partner is reviewed and approved first.</p></section>`}
function nav(){if(['login','register','onboarding','pending','detail'].includes(riderScreen))return '';return `<footer class="bottom"><div class="nav">${[['jobs','⌂','Jobs'],['active','🛵','Active'],['account','◉','Account']].map(x=>`<button class="${riderTab===x[0]?'active':''}" onclick="riderTab='${x[0]}';riderScreen='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></footer>`}
function render(){let view={login:login,register:registerPage,onboarding:onboardingPage,pending:pendingPage,jobs:jobsPage,active:activePage,account:accountPage,detail:detailPage}[riderScreen]||login;document.getElementById('root').innerHTML=view()+nav()}
window.FeastlyRiderBack=function(){if(riderScreen==='register'){riderScreen='login';render();return 'handled'}if(riderScreen==='detail'){riderScreen='active';render();return 'handled'}if(!['jobs','login','onboarding','pending'].includes(riderScreen)){riderScreen='jobs';riderTab='jobs';render();return 'handled'}return 'root'};
render();if(riderSession)bootstrapPartner();
</script><style>
.shell{animation:none!important}.route-action{display:flex;align-items:center;gap:11px;width:100%;border:1px solid #2A5B7E;background:#0E2B48;color:#E9F8FF;border-radius:15px;padding:13px;margin:10px 0;text-align:left}.route-action span{width:39px;height:39px;border-radius:12px;background:#168CEE;display:grid;place-items:center;font-size:19px}.route-action b{display:block;font-size:12px}.route-action small{display:block;color:#9EC5DF;margin-top:4px}.handover-wait{padding:14px;border-radius:15px;background:#F3B43A18;border:1px solid #F3B43A55;color:#FFD98B;font-size:11px;line-height:1.5;margin:12px 0}.customer-panel{border-left:3px solid #33C9FF}.customer-panel .line div{overflow-wrap:anywhere}
</style><script>
/* Two-leg rider journey with mandatory active location and durable verification files. */
let pendingDeliveryStart=null;
function assignable(){return riderOrders.filter(o=>['Ready for pickup','Accepted','Preparing'].includes(o.status||'Order placed')&&!o.riderId)}
function mine(){return riderOrders.filter(o=>o.riderId===riderSession.uid&&!['Delivered','Cancelled'].includes(o.status))}
function preparePartnerDocument(event,key){let file=event.target.files&&event.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){partnerNotice('Choose a JPG, PNG or WebP image.');return}if(file.size>8*1024*1024){partnerNotice('Choose an image smaller than 8 MB.');return}let state=document.getElementById(key+'State');if(state)state.textContent='COMPRESSING…';compressPartnerDocument(file).then(data=>{partnerDocumentDraft[key]=data;if(state){state.textContent='READY';state.style.color='#8EEDC5'}}).catch(e=>{if(state)state.textContent='REQUIRED';partnerNotice(e.message||'This image could not be prepared.')})}
function navigationTarget(location,fallback){location=location||{};let lat=Number(location.lat),lng=Number(location.lng);return Number.isFinite(lat)&&Number.isFinite(lng)?lat+','+lng:(location.address||location.details||fallback||'')}
function openRiderNavigation(target){if(window.FeastlyRiderNative&&window.FeastlyRiderNative.openNavigation)window.FeastlyRiderNative.openNavigation(target)}
function jobCard(o,owned){let address=o.address||{},items=(o.items||[]).map(x=>(x.qty||1)+' × '+x.name).join(', ')||'Order items';return `<article class="card"><div class="job-head"><div class="job-icon">${owned?'🛵':'🍽️'}</div><div class="job-title"><b>${esc(o.restaurant||'Restaurant')}</b><small>Order #${esc(o.id)} · ${cash(o.total)}</small></div><div class="amount">${owned?'LIVE':'NEW'}</div></div><span class="tag ${owned?'':'wait'}">${esc(statusName(o.status))}</span><div class="line"><span>◉</span><div><b>Pick up</b><br>${esc((o.restaurantLocation||{}).address||o.restaurant||'Restaurant')}</div></div><div class="line"><span>⌖</span><div><b>Deliver to</b><br>${esc(address.label||'Customer address')} · ${esc(address.details||'Address unavailable')}</div></div><div class="line"><span>▣</span><div>${esc(items)}</div></div>${owned?`<button class="primary" onclick="openJob('${esc(o.id)}')">Manage delivery</button>`:`<button class="primary" onclick="claimJob('${esc(o.userId)}','${esc(o.id)}')">Accept delivery</button>`}</article>`}
function detailPage(){let o=riderOrders.find(x=>x.id===activeJobId);if(!o){riderScreen='active';return activePage()}let address=o.address||{},restaurant=o.restaurantLocation||{},atRestaurant=['Assigned','Ready for pickup','Accepted','Preparing'].includes(o.status),handed=o.status==='Handed to rider',onWay=['Out for delivery','Near you','Arrived'].includes(o.status);return `<section class="shell"><header class="top"><button class="icon" onclick="riderScreen='active';render()">‹</button><div class="copy"><div class="eyebrow">DELIVERY DETAILS</div><h1>${esc(o.restaurant||'Order')}</h1></div></header><span class="tag">${esc(statusName(o.status))}</span><article class="card customer-panel"><div class="line"><span>◉</span><div><b>${esc(o.customerName||'Feastly customer')}</b><br>${esc(o.customerPhone||address.phone||'Mobile not provided')}</div></div><div class="line"><span>⌖</span><div><b>Delivery address</b><br>${esc(address.details||'Not available')}</div></div><div class="line"><span>₹</span><div><b>${esc(o.paymentMethod||'COD')}</b><br>${cash(o.total)}</div></div></article><button class="route-action" onclick="openRiderNavigation('${esc(navigationTarget(restaurant,o.restaurant))}')"><span>◉</span><div><b>Navigate to restaurant</b><small>${esc(restaurant.address||o.restaurant||'Pickup point')}</small></div></button>${atRestaurant?`<div class="handover-wait"><b>Pickup step</b><br>Go to the restaurant first. After the restaurant or authorised staff marks “Handed to rider”, the customer route will unlock.</div>`:''}${handed?`<button class="primary" onclick="beginCustomerDelivery('${esc(o.userId)}','${esc(o.id)}')">Confirm pickup & navigate to customer</button>`:''}${onWay?`<button class="route-action" onclick="openRiderNavigation('${esc(navigationTarget(address,address.details))}')"><span>⌖</span><div><b>Navigate to customer</b><small>${esc(address.details||'Delivery address')}</small></div></button><button class="primary" onclick="updateJob('${esc(o.userId)}','${esc(o.id)}','Delivered')">Complete delivery</button>`:''}</section>`}
async function finishClaimJob(uid,id){let order=riderOrders.find(o=>o.userId===uid&&o.id===id);if(!order)return;let path='feastly/orders/'+uid+'/'+id;try{await db('PUT',path+'/riderId',riderSession.uid);await Promise.all([db('PUT',path+'/riderName',profileName()),db('PUT',path+'/status','Assigned'),db('PUT',path+'/updatedAt',Date.now())]);order.riderId=riderSession.uid;order.riderName=profileName();order.status='Assigned';pendingLocationClaim=null;locationBlocked=false;await startNativeTracking(order,'pickup');openRiderNavigation(navigationTarget(order.restaurantLocation,order.restaurant));riderTab='active';riderScreen='detail';activeJobId=order.id;render()}catch(e){alert('This delivery could not be accepted. It may already be assigned.');refreshJobs(false)}}
async function beginCustomerDelivery(uid,id){let order=riderOrders.find(o=>o.userId===uid&&o.id===id);if(!order)return;pendingDeliveryStart={uid,id};if(window.FeastlyRiderNative&&window.FeastlyRiderNative.requestLocationAccess)window.FeastlyRiderNative.requestLocationAccess();else finishCustomerDelivery(uid,id)}
async function finishCustomerDelivery(uid,id){let order=riderOrders.find(o=>o.userId===uid&&o.id===id);if(!order)return;try{await updateJob(uid,id,'Out for delivery');pendingDeliveryStart=null;locationBlocked=false;await startNativeTracking(order,'delivery');openRiderNavigation(navigationTarget(order.address,(order.address||{}).details))}catch(e){alert('Pickup could not be confirmed.')}}
function riderLocationPermissionResult(granted,enabled){if(granted&&enabled&&pendingLocationClaim){finishClaimJob(pendingLocationClaim.uid,pendingLocationClaim.id);return}if(granted&&enabled&&pendingDeliveryStart){finishCustomerDelivery(pendingDeliveryStart.uid,pendingDeliveryStart.id);return}locationBlocked=true;pendingLocationClaim=null;pendingDeliveryStart=null;render()}
async function startNativeTracking(order,forcedPhase){if(!order||!riderSession||!window.FeastlyRiderNative)return;let active=await valid(),address=order.address||{},phase=forcedPhase||(['Out for delivery','Near you','Arrived'].includes(order.status)?'delivery':'pickup'),lat=Number(address.lat),lng=Number(address.lng);if(window.FeastlyRiderNative.startAdvancedTracking)window.FeastlyRiderNative.startAdvancedTracking(order.userId,order.id,riderSession.uid,profileName(),active.idToken,Number.isFinite(lat)?lat:NaN,Number.isFinite(lng)?lng:NaN,phase);else if(window.FeastlyRiderNative.startDeliveryTracking)window.FeastlyRiderNative.startDeliveryTracking(order.userId,order.id,riderSession.uid,profileName(),active.idToken)}
async function refreshJobs(showError){if(riderLoading||!riderSession)return;if(riderProfile.status!=='approved'){await bootstrapPartner();return}riderLoading=true;try{riderOrders=flatten(await db('GET','feastly/orders'));let current=mine()[0];if(current)startNativeTracking(current);if(!riderTimer)riderTimer=setInterval(()=>refreshJobs(false),10000)}catch(e){if(showError)alert('Live orders could not be loaded. Check your connection and approval status.')}finally{riderLoading=false;render()}}
function accountPage(){return `<section class="shell"><header class="top"><div class="mark">◉</div><div class="copy"><div class="eyebrow">APPROVED PARTNER</div><h1>${esc(profileName())}</h1></div></header><article class="card"><div class="line"><span>●</span><div><b style="color:#89ECC0">Approved and available</b><br>Live operational access is active.</div></div><div class="line"><span>☎</span><div><b>${esc(riderProfile.phone||'Mobile not recorded')}</b><br>${esc(riderProfile.vehicleType||'Vehicle')} · ${esc(riderProfile.vehicleNumber||'Number not recorded')}</div></div><div class="line"><span>⌁</span><div><b>Restricted verification record</b><br>Masked identity copies are retained in protected storage and visible only to approved owner administrators.</div></div></article><button class="secondary" onclick="signOut()">Sign out</button></section>`}
const onboardingOriginal=onboardingPage;
onboardingPage=function(){return onboardingOriginal().replace('Copies are removed after approval.','Masked copies are retained in protected verification storage according to Feastly’s retention policy.')};
render=function(){let view={login,register:registerPage,onboarding:onboardingPage,pending:pendingPage,jobs:jobsPage,active:activePage,account:accountPage,detail:detailPage}[riderScreen]||login;document.getElementById('root').innerHTML=view()+nav()};
render();
</script><script>
/* Keep the restaurant staff index synchronized with rider ownership and progress. */
async function finishClaimJob(uid,id){let order=riderOrders.find(o=>o.userId===uid&&o.id===id);if(!order)return;let path='feastly/orders/'+uid+'/'+id,rid=order.restaurantId||'';try{await db('PUT',path+'/riderId',riderSession.uid);await Promise.all([db('PUT',path+'/riderName',profileName()),db('PUT',path+'/status','Assigned'),db('PUT',path+'/updatedAt',Date.now())]);if(rid){let mirror='feastly/restaurantOrders/'+rid+'/'+uid+'/'+id;await Promise.all([db('PUT',mirror+'/riderId',riderSession.uid),db('PUT',mirror+'/riderName',profileName()),db('PUT',mirror+'/status','Assigned'),db('PUT',mirror+'/updatedAt',Date.now())])}order.riderId=riderSession.uid;order.riderName=profileName();order.status='Assigned';pendingLocationClaim=null;locationBlocked=false;await startNativeTracking(order,'pickup');openRiderNavigation(navigationTarget(order.restaurantLocation,order.restaurant));riderTab='active';riderScreen='detail';activeJobId=order.id;render()}catch(e){alert('This delivery could not be accepted. It may already be assigned.');refreshJobs(false)}}
async function updateJob(uid,id,status){let order=riderOrders.find(o=>o.userId===uid&&o.id===id),path='feastly/orders/'+uid+'/'+id,now=Date.now();try{await db('PUT',path+'/status',status);await db('PUT',path+'/updatedAt',now);if(order&&order.restaurantId){let mirror='feastly/restaurantOrders/'+order.restaurantId+'/'+uid+'/'+id;await db('PUT',mirror+'/status',status);await db('PUT',mirror+'/updatedAt',now)}if(order)order.status=status;if(status==='Delivered'&&window.FeastlyRiderNative&&window.FeastlyRiderNative.stopDeliveryTracking)window.FeastlyRiderNative.stopDeliveryTracking();riderScreen='detail';render()}catch(e){alert('The delivery status could not be saved. Please keep Location on and try again.')}}
</script></body></html>
