function authEndpoint(path){return 'https://identitytoolkit.googleapis.com/v1/'+path+'?key='+encodeURIComponent(firebase.apiKey||'')}
async function jsonRequest(url,options){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error((data.error&&data.error.message)||'Please check your connection and try again.');return data}
async function firebaseAuth(path,payload){if(!firebase.apiKey)throw new Error('Firebase is not configured for this app.');return jsonRequest(authEndpoint(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}

async function validSession(){if(!authSession)return null;if(Date.now()<authSession.expiresAt)return authSession;if(!authSession.refreshToken)throw new Error('Your session has expired. Please sign in again.');const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:authSession.refreshToken});const data=await jsonRequest('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(firebase.apiKey||''),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()});setFirebaseSession(data);return authSession}

async function loadAccountData(){if(!authSession)return;try{const results=await Promise.all([databaseRequest('GET','feastly/users/'+authSession.uid),databaseRequest('GET','feastly/orders/'+authSession.uid)]);const profile=results[0]||{},orderMap=results[1]||{};profileName=profile.name||profileName;profileEmail=profile.email||profileEmail;profilePhone=profile.phone||profilePhone;savedAddresses=Array.isArray(profile.addresses)?profile.addresses:savedAddresses;selectedAddressId=profile.selectedAddressId||selectedAddressId;favouriteIds=Array.isArray(profile.favouriteIds)?profile.favouriteIds:favouriteIds;userOrders=Object.keys(orderMap).map(key=>Object.assign({id:key},orderMap[key])).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));persistUserData();if(screen==='home'||screen==='orders'||screen==='account')render()}catch(e){/* The local cache keeps the app usable while offline. */}}

function friendlyAuthError(error){const message=(error&&error.message)||'Something went wrong. Please try again.';if(message.includes('EMAIL_EXISTS'))return 'An account already exists with this email. Sign in instead.';if(message.includes('INVALID_LOGIN_CREDENTIALS')||message.includes('INVALID_PASSWORD')||message.includes('EMAIL_NOT_FOUND'))return 'Email or password is incorrect.';if(message.includes('WEAK_PASSWORD'))return 'Use a password with at least 6 characters.';if(message.includes('INVALID_EMAIL'))return 'Enter a valid email address.';return message.replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase())}
async function signInWithEmail(){const email=(document.getElementById('loginEmail').value||'').trim(),password=document.getElementById('loginPassword').value||'';authFeedback('loginNotice','');if(!email||!password){authFeedback('loginNotice','Enter your email and password.');return}setSubmitState('loginSubmit',true,'Sign in securely');try{const data=await firebaseAuth('accounts:signInWithPassword',{email:email,password:password,returnSecureToken:true});setFirebaseSession(data);profileEmail=data.email||email;finishAuthentication()}catch(e){authFeedback('loginNotice',friendlyAuthError(e))}finally{setSubmitState('loginSubmit',false,'Sign in securely')}}

artQty()} item${cartQty()>1?'s':''} added</span><b>View cart · ${rupees(orderTotal())}</b></button>`:''}`}
function restaurantWithPhotos(){let r=restaurants[selectedRestaurant];const menu=r.items.map((d,i)=>`<div class="menu-item"><div class="menu-copy"><div class="${d[5]==='nonveg'?'nonveg':'veg'}">${d[5]==='nonveg'?'● Non-veg':'✦ Veg'}</div><div class="dish-title">${d[0]}</div><div class="dish-desc">${d[1]}</div><div class="price">${rupees(d[2])}</div></div><div class="dish-side"><div class="dish-media">${d[4]?`<img src="${d[4]}" alt="${escapeHtml(d[0])}">`:d[3]}</div><button class="add-btn" onclick="addItem(${selectedRestaurant},${i})">ADD +</button></div></div>`).join('');const info=`<div class="cart-card"><b>About this kitchen</b><p class="subtle" style="margin-top:9px">${escapeHtml(r.location||'Freshly made, responsibly packed and delivered with care.')}</p>${r.name==='55 Bistro'?`<p class="subtle" style="margin-top:13px;font-size:10px">Photos: 55 Bistro public listing image; illustrative menu photography from Wikimedia Commons (CC-licensed).</p>`:''}</div>`;return `<section class="app screen"><div class="back-row"><button class="round-btn" onclick="go('home')">‹</button><div><h1>${r.name}</h1><p class="subtle">${r.type} · <span style="color:#F59E0B">★</span> ${r.rating} · ${r.time}</p></div></div><div class="hero-art ${r.image?'restaurant-photo':''}">${r.image?`<img src="${r.image}" alt="${escapeHtml(r.name)} restaurant interior">`:`<span>${r.emoji}</span>`}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:17px"><div><b style="font-size:14px">${r.name}</b><div class="subtle">${r.fee} · Opens until 11:30 PM</div></div><button class="round-btn" style="color:var(--blue)" onclick="toggleFavourite(selectedRestaurant)">${isFavourite(selectedRestaurant)?'♥':'♡'}</button></div><div class="menu-tabs">${['Menu','Reviews','Info'].map(x=>`<button class="${menuTab===x?'active':''}" onclick="menuTab='${x}';render()">${x}</button>`).join('')}</div>${menuTab==='Menu'?`<div class="section-head" style="margin-top:0"><h2>Most loved</h2></div>${menu}`:menuTab==='Reviews'?`<div class="cart-card"><b>${r.rating} ★ Customer rating</b><p class="subtle" style="margin-top:9px">Restaurant reviews will be saved with authenticated customer accounts.</p></div>`:info}</section>${cartQty()?`<button class="cart-float" onclick="go('cart')"><span>${cartQty()} item${cartQty()>1?'s':''} added</span><b>View cart · ${rupees(orderTotal())}</b></button>`:''}`}
function cartPage(){if(!cart.length)return `<section class="app screen"><div class="back-row"><button class="round-btn" onclick="go('home')">‹</button><h1>Your cart</h1></div><div class="empty"><div class="empty-icon">🛍️</div>Your cart is waiting for something delicious.<br><button class="primary" style="margin-top:22px;max-width:250px" onclick="go('home')">Explore restaurants</button></div></section>`;let delivery=selectedAddress()||{label:'Choose a delivery address',details:'Set your address before placing the order'};return `<section class="app screen"><div class="back-row"><button class="round-btn" onclick="go('restaurant')">‹</button><div><h1>Your cart</h1><p class="subtle">${cart[0].restaurant}</p></div></div><div class="cart-card">${cart.map((x,i)=>`<div class="cart-row"><div class="cart-emoji">${x.emoji}</div><div class="cart-name">${x.name}<small>${rupees(x.price)} each</small></div><div class="stepper"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div>`).join('')}</div><div class="address-card"><b style="font-size:13px">Delivering to</b><div style="display:flex;gap:11px;margin-top:12px"><span style="color:var(--blue);font-size:20px">⌖</span><div><b style="font-size:13px">${escapeHtml(delivery.label)}</b><div class="subtle">${escapeHtml(delivery.details)}</div></div><button class="link" style="margin-left:auto" onclick="go('addresses')">Change</button></div></div><div class="payment-card"><div class="price-line"><span>Item total</span><span>${rupees(itemTotal())}</span></div><div class="price-line"><span>Delivery fee</span><span>${rupees(deliveryFee())}</span></div><div class="price-line"><span>Platform fee</span><span>${rupees(serviceFee())}</span></div><div class="price-line total"><span>Order total</span><span>${rupees(orderTotal())}</span></div></div><button class="primary" onclick="go('checkout')">Review order · ${rupees(orderTotal())}</button></section>`}
async function submitOrder(){const delivery=selectedAddress();if(!delivery){go('addresses');return}if(!authSession){go('login');return}const button=document.getElementById('checkoutSubmit');if(button){button.disabled=true;button.textContent='Saving your order…'}const createdAt=Date.now(),id='FT-'+createdAt.toString().slice(-7),order={id:id,restaurant:cart[0].restaurant,items:cart.map(item=>Object.assign({},item)),total:orderTotal(),paymentMethod:payment,address:delivery,status:'Order placed',createdAt:createdAt};try{await databaseRequest('PUT','feastly/orders/'+authSession.uid+'/'+id,order);currentOrder=order;userOrders=[order].concat(userOrders.filter(item=>item.id!==id));localStorage.setItem('feastlyCurrentOrder',JSON.stringify(order));placedOrder=true;cart=[];activeTab='orders';go('orderSuccess')}catch(e){if(button){button.disabled=false;button.textContent='Place order · '+rupees(orderTotal())}alert('We could not save this order. Please check your internet and try again.')}}
