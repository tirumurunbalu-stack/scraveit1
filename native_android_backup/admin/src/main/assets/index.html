<body><main id="root"></main><script src="firebase-config.js"></script><script>
const firebase=window.FEASTLY_FIREBASE||{};
const ADMIN_EMAILS=['tirumurubalu@gmail.com','23kb1a3351@nbkrist.org','personal08030803@gmail.com'];
const DEFAULT_RESTAURANTS=[{id:'55-bistro',name:'55 Bistro',type:'Continental · Chinese · Biryani',icon:'🍽️',open:true},{id:'bombay-bowl',name:'Bombay Bowl',type:'Indian · Bowls',icon:'🍛',open:true},{id:'little-napoli',name:'Little Napoli',type:'Italian · Pizza',icon:'🍕',open:true},{id:'green-theory',name:'Green Theory',type:'Healthy · Salads',icon:'🥗',open:true},{id:'melt-co',name:'Melt & Co.',type:'Burgers · American',icon:'🍔',open:true}];
let session=readJson('feastlyAdminSession',null),screen=session?'dashboard':'login',activeTab='dashboard',backStack=[],orders=[],users={},restaurantConfig={},loading=false,orderFilter='All',searchQuery='',selectedOrderId='',lastRefresh=0,refreshTimer=null;
function readJson(key,fallback){try{let value=JSON.parse(localStorage.getItem(key));return value===null?fallback:value}catch(e){return fallback}}
function esc(value){return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(value){return '₹'+Number(value||0).toLocaleString('en-IN')}
function authEndpoint(path){return 'https://identitytoolkit.googleapis.com/v1/'+path+'?key='+encodeURIComponent(firebase.apiKey||'')}
async function request(url,options){let response=await fetch(url,options),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error((data.error&&data.error.message)||'Check your internet connection and try again.');return data}
async function auth(path,payload){if(!firebase.apiKey)throw new Error('Firebase configuration is missing.');return request(authEndpoint(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}
function saveSession(data,email){session={uid:data.localId||data.user_id,idToken:data.idToken||data.id_token,refreshToken:data.refreshToken||data.refresh_token,email:email,expiresAt:Date.now()+Math.max(1,Number(data.expiresIn||data.expires_in||3600)-60)*1000};localStorage.setItem('feastlyAdminSession',JSON.stringify(session))}
async function validSession(){if(!session)throw new Error('Sign in again to continue.');if(Date.now()<session.expiresAt)return session;let form=new URLSearchParams({grant_type:'refresh_token',refresh_token:session.refreshToken}),data=await request('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(firebase.apiKey||''),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form.toString()});saveSession(data,session.email);return session}
async function db(method,path,payload){let s=await validSession(),url=(firebase.databaseUrl||'').replace(/\/$/,'')+'/'+path+'.json?auth='+encodeURIComponent(s.idToken);return request(url,{method:method,headers:payload===undefined?undefined:{'Content-Type':'application/json'},body:payload===undefined?undefined:JSON.stringify(payload)})}
function setNotice(id,text,type){let box=document.getElementById(id);if(box){box.textContent=text||'';box.className='notice '+(text?(type||'error'):'')}}
function setBusy(id,busy,label){let button=document.getElementById(id);if(button){button.disabled=busy;button.textContent=busy?'Signing in…':label}}
function friendly(error){let m=(error&&error.message)||'Something went wrong. Please try again.';if(m.includes('INVALID_LOGIN_CREDENTIALS')||m.includes('INVALID_PASSWORD')||m.includes('EMAIL_NOT_FOUND'))return 'Email or password is incorrect.';if(m.includes('TOO_MANY_ATTEMPTS_TRY_LATER'))return 'Too many attempts. Please wait and try again.';return m.replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase())}
async function adminSignIn(){let email=(document.getElementById('email').value||'').trim().toLowerCase(),password=document.getElementById('password').value||'';setNotice('loginNotice','');if(!email||!password){setNotice('loginNotice','Enter your admin email and password.');return}if(!ADMIN_EMAILS.includes(email)){setNotice('loginNotice','This account is not approved for Feastly Admin.');return}setBusy('signIn',true,'Sign in securely');try{let data=await auth('accounts:signInWithPassword',{email:email,password:password,returnSecureToken:true});saveSession(data,email);screen='dashboard';activeTab='dashboard';backStack=[];render();await refreshData(true)}catch(e){setNotice('loginNotice',friendly(e))}finally{setBusy('signIn',false,'Sign in securely')}}
function signOut(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=null;session=null;orders=[];users={};localStorage.removeItem('feastlyAdminSession');screen='login';backStack=[];render()}
function flattenOrders(tree){let list=[];Object.keys(tree||{}).forEach(uid=>Object.keys(tree[uid]||{}).forEach(id=>list.push(Object.assign({id:id,userId:uid},tree[uid][id]||{}))));return list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
async function refreshData(force){if(loading)return;loading=true;render();try{let result=await Promise.all([db('GET','feastly/orders'),db('GET','feastly/users'),db('GET','feastly/admin/restaurants')]);orders=flattenOrders(result[0]);users=result[1]||{};restaurantConfig=result[2]||{};lastRefresh=Date.now();if(!refreshTimer)refreshTimer=setInterval(()=>refreshData(false),30000)}catch(e){if(force)alert('Could not load operational data. Firebase database permissions may need an admin rule.')}finally{loading=false;render()}}
function getUser(id){return users[id]||{name:'Feastly customer',email:'Customer account'}}
function statusClass(value){return ({'Order placed':'placed','Accepted':'accepted','Preparing':'preparing','Out for delivery':'out','Delivered':'delivered','Cancelled':'cancelled'})[value]||'placed'}
function orderCard(order,compact){let customer=getUser(order.userId),name=customer.name||customer.email||'Feastly customer',items=(order.items||[]).map(x=>x.name).filter(Boolean).join(', ')||'Order items';return `<article class="card"><div class="order-head"><div class="avatar">${esc((name||'F').charAt(0).toUpperCase())}</div><div class="order-title"><b>${esc(order.restaurant||'Restaurant order')}</b><small>${esc(name)} · ${new Date(order.createdAt||Date.now()).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</small></div><div class="amount">${money(order.total)}</div></div><span class="status ${statusClass(order.status)}">${esc(order.status||'Order placed')}</span>${compact?`<button class="link" style="float:right;margin-top:6px" onclick="openOrder('${esc(order.id)}')">Manage ›</button>`:`<div class="fade" style="font-size:10px;color:var(--muted);margin:9px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(items)}</div><select class="select-status" onchange="setStatus('${esc(order.userId)}','${esc(order.id)}',this.value)">${['Order placed','Accepted','Preparing','Out for delivery','Delivered','Cancelled'].map(v=>`<option ${v===(order.status||'Order placed')?'selected':''}>${v}</option>`).join('')}</select>`}</article>`}
function dashboard(){let active=orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)),delivered=orders.filter(o=>o.status==='Delivered'),gmv=orders.reduce((sum,o)=>sum+Number(o.total||0),0),pending=orders.filter(o=>o.status==='Order placed').length;return `<section class="screen"><header class="top"><div class="brandmark">F</div><div class="top-copy"><div class="eyebrow">FEASTLY CONTROL ROOM</div><h1>Good ${timeGreeting()}, ${esc((session.email||'Admin').split('@')[0])}.</h1></div><button class="icon-btn" onclick="refreshData(true)" aria-label="Refresh">↻</button></header><div class="hero"><small><span class="sync-dot"></span>${loading?'SYNCING LIVE DATA':'LIVE OPERATIONS'}</small><h2>${active.length?active.length+' active order'+(active.length===1?'':'s')+' need attention':'Everything is under control.'}</h2><p>${lastRefresh?'Last synced '+new Date(lastRefresh).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'Connect securely to your Feastly operational data.'}</p><button class="refresh" onclick="refreshData(true)">${loading?'Syncing…':'Refresh data'}</button></div><div class="metrics"><div class="metric"><small>ACTIVE ORDERS</small><b>${active.length}</b><span>${pending} awaiting acceptance</span></div><div class="metric orange"><small>TODAY'S GMV</small><b>${money(gmv)}</b><span>${orders.length} total orders</span></div><div class="metric green"><small>COMPLETED</small><b>${delivered.length}</b><span>Delivered orders</span></div><div class="metric"><small>CUSTOMERS</small><b>${Object.keys(users).length}</b><span>Saved accounts</span></div></div><div class="section-head"><h2>Needs attention</h2><button class="link" onclick="switchTab('orders')">See all</button></div>${active.length?active.slice(0,3).map(o=>orderCard(o,true)).join(''):'<div class="empty">No active orders right now.<br>New customer orders will appear here after they are saved in Feastly.</div>'}${adminBanner()}</section>`}
function ordersPage(){let filtered=orders.filter(o=>(orderFilter==='All'||(o.status||'Order placed')===orderFilter)&&((o.restaurant||'').toLowerCase().includes(searchQuery)||((getUser(o.userId).name||'')+' '+(getUser(o.userId).email||'')).toLowerCase().includes(searchQuery)));let tabs=['All','Order placed','Accepted','Preparing','Out for delivery','Delivered'];return `<section class="screen"><header class="top"><div class="brandmark">≡</div><div class="top-copy"><div class="eyebrow">ORDER OPERATIONS</div><h1>Every order, in control.</h1></div><button class="icon-btn" onclick="refreshData(true)">↻</button></header><input class="search" placeholder="Search restaurant or customer" value="${esc(searchQuery)}" oninput="searchQuery=this.value.toLowerCase();render()"><div class="filters">${tabs.map(x=>`<button class="filter ${orderFilter===x?'active':''}" onclick="orderFilter='${x}';render()">${x}</button>`).join('')}</div>${filtered.length?filtered.map(o=>orderCard(o,false)).join(''):'<div class="empty">No orders match this view.</div>'}</section>`}
function restaurantList(){let configs=Object.assign({},restaurantConfig);return DEFAULT_RESTAURANTS.map(r=>{let saved=configs[r.id]||{},isOpen=saved.open!==undefined?saved.open:r.open;return `<article class="card rest-card"><div class="rest-icon">${r.icon}</div><div class="rest-copy"><b>${r.name}</b><small>${r.type}</small><span class="tag">${isOpen?'Accepting orders':'Temporarily paused'}</span></div><button class="switch ${isOpen?'on':''}" aria-label="Toggle ${r.name}" onclick="toggleRestaurant('${r.id}')"></button></article>`}).join('')}
function restaurantsPage(){let online=DEFAULT_RESTAURANTS.filter(r=>(restaurantConfig[r.id]||{}).open!==false).length;return `<section class="screen"><header class="top"><div class="brandmark">⌂</div><div class="top-copy"><div class="eyebrow">RESTAURANT PARTNERS</div><h1>${online} of ${DEFAULT_RESTAURANTS.length} restaurants accepting orders.</h1></div></header><div class="admin-banner"><b>LIVE CATALOG</b><span>Operational availability is stored in Feastly Admin. Connect catalog sync before showing new restaurants in the customer app.</span></div><div class="section-head"><h2>Restaurant availability</h2><button class="link" onclick="refreshData(true)">Refresh</button></div>${restaurantList()}</section>`}
function customersPage(){let entries=Object.keys(users).map(uid=>({uid:uid,data:users[uid]||{}})).sort((a,b)=>(b.data.updatedAt||0)-(a.data.updatedAt||0));return `<section class="screen"><header class="top"><div class="brandmark">◉</div><div class="top-copy"><div class="eyebrow">CUSTOMER INSIGHTS</div><h1>Your Feastly community.</h1></div></header><div class="metrics"><div class="metric"><small>REGISTERED</small><b>${entries.length}</b><span>Customer profiles</span></div><div class="metric green"><small>ORDERS SAVED</small><b>${orders.length}</b><span>Across all customers</span></div></div><div class="section-head"><h2>Customer directory</h2><button class="link" onclick="refreshData(true)">Refresh</button></div>${entries.length?entries.map(entry=>{let d=entry.data,orderCount=orders.filter(o=>o.userId===entry.uid).length,name=d.name||d.email||'Feastly customer';return `<article class="card customer"><div class="avatar">${esc(name.charAt(0).toUpperCase())}</div><div class="customer-copy"><b>${esc(name)}</b><small>${esc(d.email||'No email recorded')}${d.phone?' · '+esc(d.phone):''}</small></div><div class="customer-orders">${orderCount}<small style="display:block;color:var(--muted);font-size:9px;margin-top:2px">orders</small></div></article>`}).join(''):'<div class="empty">Customer profiles will appear here after customer sign-up.</div>'}</section>`}
function morePage(){return `<section class="screen"><header class="top"><div class="brandmark">⚙</div><div class="top-copy"><div class="eyebrow">ADMIN SETTINGS</div><h1>Secure operations.</h1></div></header><div class="card"><div class="insight"><div><b>${esc(session.email||'Admin')}</b><small>Approved Feastly administrator</small></div><span class="status delivered">Verified</span></div></div><div class="card"><div class="line"><span>Data connection</span><b><span class="sync-dot"></span>Firebase live</b></div><div class="line"><span>Auto refresh</span><b>Every 30 seconds</b></div><div class="line"><span>Payment collection</span><b>Not enabled</b></div></div>${adminBanner()}<button class="primary" onclick="signOut()">Sign out of Admin</button></section>`}
function detailPage(){let order=orders.find(o=>o.id===selectedOrderId);if(!order){screen='orders';return ordersPage()}let customer=getUser(order.userId),items=order.items||[];return `<section class="screen"><header class="top"><button class="detail-back" onclick="go('orders')">‹</button><div class="top-copy"><div class="eyebrow">ORDER DETAILS</div><h1>${esc(order.id||'Order')}</h1></div></header><article class="card"><div class="order-head"><div class="avatar">${esc((customer.name||customer.email||'F').charAt(0).toUpperCase())}</div><div class="order-title"><b>${esc(order.restaurant||'Restaurant')}</b><small>${esc(customer.name||customer.email||'Customer')}</small></div><div class="amount">${money(order.total)}</div></div><select class="select-status" onchange="setStatus('${esc(order.userId)}','${esc(order.id)}',this.value)">${['Order placed','Accepted','Preparing','Out for delivery','Delivered','Cancelled'].map(v=>`<option ${v===(order.status||'Order placed')?'selected':''}>${v}</option>`).join('')}</select></article><div class="section-head"><h2>Items</h2></div><article class="card">${items.length?items.map(item=>`<div class="line"><span>${esc(item.qty||1)} × ${esc(item.name||'Item')}</span><b>${money(Number(item.price||0)*Number(item.qty||1))}</b></div>`).join(''):'<div class="line"><span>Items</span><b>Not available</b></div>'}</article><div class="section-head"><h2>Delivery</h2></div><article class="card"><div class="line"><span>Address</span><b>${esc((order.address||{}).details||'Not recorded')}</b></div><div class="line"><span>Phone</span><b>${esc((order.address||{}).phone||customer.phone||'Not recorded')}</b></div><div class="line"><span>Payment</span><b>${esc(order.paymentMethod||'COD')}</b></div></article></section>`}
function adminBanner(){return `<div class="admin-banner"><b>SECURE ADMIN</b><span>Signed in as an approved administrator. Operational changes are saved to the Feastly Firebase database.</span></div>`}
function timeGreeting(){let h=new Date().getHours();return h<12?'morning':h<17?'afternoon':'evening'}
function nav(){if(screen==='login'||screen==='detail')return '';let items=[['dashboard','⌂','Home'],['orders','≡','Orders'],['restaurants','⌁','Restaurants'],['customers','◉','Customers'],['more','⚙','More']];return `<footer class="bottom"><div class="nav">${items.map(i=>`<button class="${activeTab===i[0]?'active':''}" onclick="switchTab('${i[0]}')"><span>${i[1]}</span>${i[2]}</button>`).join('')}</div></footer>`}
function switchTab(tab){activeTab=tab;screen=tab;backStack=[];window.scrollTo(0,0);render()}
function go(next){if(next!==screen)backStack.push(screen);screen=next;window.scrollTo(0,0);render()}
function handleAdminBack(){if(backStack.length){screen=backStack.pop();window.scrollTo(0,0);render();return 'handled'}if(screen!=='dashboard'&&screen!=='login'){switchTab('dashboard');return 'handled'}return 'root'}
function openOrder(id){selectedOrderId=id;go('detail')}
async function setStatus(uid,id,status){let order=orders.find(o=>o.userId===uid&&o.id===id);if(!order||order.status===status)return;let previous=order.status;order.status=status;render();try{await db('PATCH','feastly/orders/'+uid+'/'+id,{status:status,updatedAt:Date.now()});if(window.FeastlyAdminNative)window.FeastlyAdminNative.vibrateSuccess()}catch(e){order.status=previous;render();alert('Status could not be saved. Please refresh and try again.')}}
async function toggleRestaurant(id){let record=restaurantConfig[id]||{},next=record.open===undefined?false:!record.open;restaurantConfig[id]=Object.assign({},record,{open:next,updatedAt:Date.now()});render();try{await db('PATCH','feastly/admin/restaurants/'+id,restaurantConfig[id])}catch(e){delete restaurantConfig[id];render();alert('Restaurant availability could not be saved. Please refresh and try again.')}}
function login(){return `<section class="login"><div class="login-logo">F</div><h1>Feastly Admin</h1><p>A focused operations workspace for orders, restaurants and customers.</p><label class="label">Approved admin email</label><input id="email" class="field" type="email" autocomplete="email" inputmode="email" placeholder="admin@yourcompany.com"><label class="label">Password</label><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')adminSignIn()"><div id="loginNotice" class="notice" aria-live="polite"></div><button id="signIn" class="primary" onclick="adminSignIn()">Sign in securely</button><p class="login-foot"><i></i>Firebase-connected operations<br>Only approved Feastly admins can enter.</p></section>`}
function render(){let view={login:login,dashboard:dashboard,orders:ordersPage,restaurants:restaurantsPage,customers:customersPage,more:morePage,detail:detailPage}[screen]||login;document.getElementById('root').innerHTML=view()+nav()}
render();

};
let catalogData={},editingRestaurantId='',editingMenuId='',pendingMedia={};
function catalogCopy(value){return JSON.parse(JSON.stringify(value||{}))}
function catalogRecords(){let merged=catalogCopy(LIVE_STARTER_CATALOG);Object.keys(catalogData||{}).forEach(id=>{merged[id]=Object.assign({},merged[id]||{},catalogData[id]||{});merged[id].id=id;merged[id].menu=Object.assign({},(LIVE_STARTER_CATALOG[id]||{}).menu||{},(catalogData[id]||{}).menu||{})});return merged}
function catalogRestaurant(id){return catalogRecords()[id]||null}
function menuValues(restaurant){return Object.values((restaurant&&restaurant.menu)||{}).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))}
function catalogImage(value,fallback){let source=value||'';return source&&(!/^[\w-]+\.(jpg|jpeg|png|webp)$/i.test(source))?`<img src="${esc(source)}" alt="">`:(fallback||'🍽️')}
function fieldValue(id){let node=document.getElementById(id);return node?(node.value||'').trim():''}
function slugify(value){let slug=String(value||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');return slug||'restaurant-'+Date.now()}
function mediaSource(key,stored){return pendingMedia[key]||stored||''}
async function refreshData(force){if(loading)return;loading=true;render();try{let result=await Promise.all([db('GET','feastly/orders'),db('GET','feastly/users'),db('GET','feastly/catalog/restaurants')]);orders=flattenOrders(result[0]);users=result[1]||{};catalogData=result[2]||{};restaurantConfig=catalogData;lastRefresh=Date.now();if(!refreshTimer)refreshTimer=setInterval(()=>refreshData(false),30000)}catch(e){if(force)alert('Feastly Admin cannot read shared operational data yet. Approve the secure Firebase database rule, then tap Refresh.')}finally{loading=false;render()}}
async function saveCatalogRestaurant(record){record.updatedAt=Date.now();catalogData[record.id]=record;restaurantConfig=catalogData;await db('PUT','feastly/catalog/restaurants/'+encodeURIComponent(record.id),record)}
async function toggleRestaurant(id){let record=catalogCopy(catalogRestaurant(id));if(!record)return;let before=record.open;record.open=!before;catalogData[id]=record;render();try{await saveCatalogRestaurant(record)}catch(e){record.open=before;catalogData[id]=record;render();alert('Availability could not be saved. Approve the Firebase admin rule, then try again.')}}
async function publishStarterCatalog(){let button=document.getElementById('publishStarter');if(button){button.disabled=true;button.textContent='Publishing…'}try{await db('PUT','feastly/catalog/restaurants',LIVE_STARTER_CATALOG);catalogData=catalogCopy(LIVE_STARTER_CATALOG);restaurantConfig=catalogData;alert('Starter catalog published. The customer app will receive it after its next sync.');render()}catch(e){alert('The catalog could not be published yet. Approve the Firebase admin rule, then tap this button again.')}finally{if(button){button.disabled=false;button.textContent='Publish starter catalog'}}}
function restaurantList(){return Object.values(catalogRecords()).sort((a,b)=>a.name.localeCompare(b.name)).map(r=>`<article class="card rest-card" onclick="editRestaurant('${esc(r.id)}')"><div class="rest-icon">${catalogImage(r.image,r.icon||'🍽️')}</div><div class="rest-copy"><b>${esc(r.name)}</b><small>${esc(r.type||'Restaurant')}</small><span class="tag">${r.open===false?'Temporarily paused':'Accepting orders'} · ${menuValues(r).length} items</span></div><button class="switch ${r.open!==false?'on':''}" aria-label="Toggle ${esc(r.name)}" onclick="event.stopPropagation();toggleRestaurant('${esc(r.id)}')"></button></article>`).join('')}
function restaurantsPage(){let records=Object.values(catalogRecords()),online=records.filter(r=>r.open!==false).length;return `<section class="screen"><header class="top"><div class="brandmark">⌂</div><div class="top-copy"><div class="eyebrow">RESTAURANT PARTNERS</div><h1>${online} of ${records.length} restaurants accepting orders.</h1></div><button class="icon-btn" onclick="refreshData(true)">↻</button></header><div class="admin-banner"><b>LIVE CATALOG</b><span>Restaurant, menu, dietary tags and photos are shared with the Feastly customer app.</span></div><div class="catalog-actions"><button class="secondary-admin" id="publishStarter" onclick="publishStarterCatalog()">Publish starter catalog</button><button class="primary" style="margin:0;padding:12px" onclick="newRestaurant()">+ Add restaurant</button></div><div class="section-head"><h2>Restaurant catalog</h2><button class="link" onclick="refreshData(true)">Refresh</button></div>${restaurantList()}</section>`}
function newRestaurant(){editingRestaurantId='';pendingMedia={};go('restaurantEdit')}
function editRestaurant(id){editingRestaurantId=id;pendingMedia={};go('restaurantEdit')}
function restaurantEditor(){let r=editingRestaurantId?catalogCopy(catalogRestaurant(editingRestaurantId)): {id:'',name:'',type:'',icon:'🍽️',open:true,rating:'4.5',time:'25–30 min',fee:'₹39 delivery',location:'',image:'',menu:{}};let image=mediaSource('restaurant',r.image);return `<section class="screen"><header class="top"><button class="detail-back" onclick="go('restaurants')">‹</button><div class="top-copy"><div class="eyebrow">${editingRestaurantId?'EDIT RESTAURANT':'NEW RESTAURANT'}</div><h1 class="editor-title">${editingRestaurantId?esc(r.name):'Create restaurant'}</h1></div></header><p class="editor-sub">Changes are queued to the shared catalog and appear in Feastly after sync.</p><label class="label">Restaurant name</label><input id="rName" class="field" value="${esc(r.name)}" placeholder="Example: 55 Bistro"><label class="label">Cuisines</label><input id="rType" class="field" value="${esc(r.type)}" placeholder="Indian · Chinese · Biryani"><div class="row-fields"><div><label class="label">Rating</label><input id="rRating" class="field" value="${esc(r.rating)}" inputmode="decimal" placeholder="4.5"></div><div><label class="label">Delivery time</label><input id="rTime" class="field" value="${esc(r.time)}" placeholder="25–30 min"></div></div><label class="label">Delivery fee</label><input id="rFee" class="field" value="${esc(r.fee)}" placeholder="₹39 delivery"><label class="label">Restaurant address / area</label><input id="rLocation" class="field" value="${esc(r.location)}" placeholder="Restaurant address"><label class="label">Main restaurant photo</label><div class="image-preview" id="restaurantPreview">${catalogImage(image,'Add a clear storefront or dining photo')}</div><input id="rImageUrl" class="field" value="${image&& !image.startsWith('data:')?esc(image):''}" placeholder="Paste image URL (optional)"><input class="field file-field" type="file" accept="image/*" onchange="selectCatalogImage(event,'restaurant')"><p class="field-help">Choose a photo or add an async function adminSignIn(){let email=(document.getElementById('email').value||'').trim().toLowerCase(),password=document.getElementById('password').value||'';setNotice('loginNotice','');if(!email||!password){setNotice('loginNotice','Enter your email and password.');return}setBusy('signIn',true,'Sign in securely');try{let data=await auth('accounts:signInWithPassword',{email:email,password:password,returnSecureToken:true});saveSession(data,email);if(ADMIN_EMAILS.includes(email)){session.role='owner'}else{let staff=await db('GET','feastly/staff/'+session.uid);if(!staff||staff.active!==true)throw new Error('This staff account is not active. Ask the owner to grant access.');session.role='staff';session.staff=staff}localStorage.setItem('feastlyAdminSession',JSON.stringify(session));screen='dashboard';activeTab='dashboard';backStack=[];render();await refreshData(true)}catch(e){localStorage.removeItem('feastlyAdminSession');session=null;setNotice('loginNotice',friendly(e))}finally{setBusy('signIn',false,'Sign in securely')}}

function firebaseWriteMessageV9(error,action){let raw=String((error&&error.message)||'').replace(/_/g,' ');if(/permission denied/i.test(raw))return action+' was blocked by Firebase permissions. Sign out, sign in with an approved owner email, and retry.';if(/auth|token|credential|expired|invalid/i.test(raw))return 'Your secure session has expired. Sign out and sign in again.';if(/network|internet|fetch/i.test(raw))return 'Internet connection was interrupted. Check the connection and retry.';return action+' failed'+(raw?': '+raw:'.');}
async function requireVerifiedOwnerV9(){let current=await validSession();if(current.idToken!==verifiedOwnerTokenV9){let result=await auth('accounts:lookup',{idToken:current.idToken}),account=(result.users||[])[0],actual=String((account&&account.email)||'').trim().toLowerCase();if(!ADMIN_EMAILS.includes(actual))throw new Error('Authenticated Firebase account is not an approved owner.');current.email=actual;current.role='owner';delete current.staff;localStorage.setItem('feastlyAdminSession',JSON.stringify(current));verifiedOwnerTokenV9=current.idToken}return current}
function armDestructiveActionV9(key,button,label){let now=Date.now();if(deleteArmV9.key===key&&deleteArmV9.until>now)return true;deleteArmV9={key:key,until:now+5000,timer:null};if(button){let original=button.textContent;button.textContent='Tap again to confirm';button.classList.add('owner-delete-note');deleteArmV9.timer=setTimeout(()=>{if(button&&document.body.contains(button)){button.textContent=original;button.classList.remove('owner-delete-note')}if(deleteArmV9.key===key)deleteArmV9={key:'',until:0,timer:null}},5000)}return false}
const saveCatalogRestaurantCoreV9=saveCatalogRestaurant;
saveCatalogRestaurant=async function(record){if(!isOwner())throw new Error('Only an approved owner can change restaurants and menu items.');await requireVerifiedOwnerV9();record.updatedAt=Date.now();await db('PUT','feastly/catalog/restaurants/'+encodeURIComponent(record.id),record);catalogData[record.id]=record;restaurantConfig=catalogData;return record};
deleteRestaurant=async function(id,button){if(!isOwner()){alert('Only an approved owner can remove restaurants.');return}if(!armDestructiveActionV9('restaurant:'+id,button||document.querySelector('[data-remove-restaurant]'),'Remove restaurant'))return;let target=button||document.querySelector('[data-remove-restaurant]');if(target)target.classList.add('action-saving');try{await requireVerifiedOwnerV9();await db('DELETE','feastly/catalog/restaurants/'+encodeURIComponent(id));delete catalogData[id];restaurantConfig=catalogData;editingRestaurantId='';editingMenuId='';pendingMedia={};deleteArmV9={key:'',until:0,timer:null};screen='restaurants';activeTab='restaurants';render();alert('Restaurant and its menu were removed successfully.')}catch(e){if(target)target.classList.remove('action-saving');alert(firebaseWriteMessageV9(e,'Restaurant removal'))}};
deleteMenuItem=async function(restaurantId,itemId,button){if(!isOwner()){alert('Only an approved owner can remove food items.');return}if(!armDestructiveActionV9('item:'+restaurantId+':'+itemId,button,'Delete food item'))return;if(button)button.classList.add('action-saving');let restaurant=catalogCopy(catalogRestaurant(restaurantId));try{await requireVerifiedOwnerV9();if(!restaurant||!restaurant.menu||!restaurant.menu[itemId])throw new Error('Food item no longer exists.');delete restaurant.menu[itemId];await saveCatalogRestaurant(restaurant);deleteArmV9={key:'',until:0,timer:null};editingMenuId='';render();alert('Food item removed successfully.')}catch(e){if(button)button.classList.remove('action-saving');alert(firebaseWriteMessageV9(e,'Food item removal'))}};
setStatus=async function(uid,id,status,button){let order=orders.find(o=>o.userId===uid&&o.id===id);if(!order||order.status===status||!can('orders'))return;let allowed=orderStatusChoices(order);if(!allowed.includes(status)){alert('This account is not allowed to set that status.');return}let previous=order.status,now=Date.now();if(button)button.classList.add('action-saving');try{if(isOwner()){await requireVerifiedOwnerV9();let changes={};changes['orders/'+uid+'/'+id+'/status']=status;changes['orders/'+uid+'/'+id+'/updatedAt']=now;if(order.restaurantId){changes['restaurantOrders/'+order.restaurantId+'/'+uid+'/'+id+'/status']=status;changes['restaurantOrders/'+order.restaurantId+'/'+uid+'/'+id+'/updatedAt']=now}await db('PATCH','feastly',changes)}else{await db('PUT','feastly/orders/'+uid+'/'+id+'/status',status);await db('PUT','feastly/orders/'+uid+'/'+id+'/updatedAt',now);if(order.restaurantId){await db('PUT','feastly/restaurantOrders/'+order.restaurantId+'/'+uid+'/'+id+'/status',status);await db('PUT','feastly/restaurantOrders/'+order.restaurantId+'/'+uid+'/'+id+'/updatedAt',now)}}order.status=status;order.updatedAt=now;if(window.FeastlyAdminNative)window.FeastlyAdminNative.vibrateSuccess();render()}catch(e){order.status=previous;if(button)button.classList.remove('action-saving');alert(firebaseWriteMessageV9(e,'Order status update'))}};
const detailPageCoreV9=detailPage;
detailPage=function(){return detailPageCoreV9().replace(/onclick="setStatus\(([^)]*)\)"/g,'onclick="setStatus($1,this)"')};
const restaurantEditorCoreV9=restaurantEditor;
restaurantEditor=function(){let html=restaurantEditorCoreV9();if(!isOwner()||!editingRestaurantId)return html;html=html.replace(/<button class="tiny-btn" onclick="editMenuItem\('([^']+)','([^']+)'\)">Edit<\/button>/g,(match,rid,itemId)=>match+`<button class="tiny-btn danger" onclick="deleteMenuItem('${rid}','${itemId}',this)">Delete</button>`);html=html.replace(/onclick="deleteRestaurant\('([^']+)'\)"/g,`data-remove-restaurant onclick="deleteRestaurant('$1',this)"`);return html.replace('<div class="editor-section"><h2>Menu and categories</h2>','<div class="editor-section"><h2>Menu and categories</h2><p class="crud-hint">Add, edit or delete every food item. Restaurant and menu changes sync to the customer app.</p>')};
const menuEditorCoreV9=menuEditor;
menuEditor=function(){let html=menuEditorCoreV9();if(!isOwner()||!editingMenuId)return html;let remove=`<button class="danger-admin" style="width:100%;margin-top:12px" onclick="deleteMenuItem('${esc(editingRestaurantId)}','${esc(editingMenuId)}',this)">Delete food item</button>`;return html.replace('<p class="save-note">',remove+'<p class="save-note">')};
render();
</script></body></html>
